services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - labnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ../Spreadit
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=docker
      - COURSE_SERVICE_URL=http://course-service:8000
      - POST_SERVICE_URL=http://post-service:8000
      - RABBIT_URL=${RABBIT_URL}
      - DATABASE_URL=postgresql+psycopg://app:app@db:5432/appdb
    networks:
      - labnet
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  course-service:
    build: ../Spreadit_CourseMicroservice
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=docker
      - MODULE_SERVICE_URL=http://module-service:8000
      - RABBIT_URL=${RABBIT_URL}
      - DATABASE_URL=postgresql+psycopg://app:app@db:5432/appdb
    networks:
      - labnet
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  module-service:
    build: ../spreadit-module
    ports:
      - "8003:8000"
    environment:
      - APP_ENV=docker
      - POST_SERVICE_URL=http://post-service:8000
      - RABBIT_URL=${RABBIT_URL}
      - DATABASE_URL=postgresql+psycopg://app:app@db:5432/appdb
    networks:
      - labnet
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  post-service:
    build: ../Spreadit_PostMicroservice
    ports:
      - "8004:8000"
    environment:
      - APP_ENV=docker
      - RABBIT_URL=${RABBIT_URL}
      - DATABASE_URL=postgresql+psycopg://app:app@db:5432/appdb
    networks:
      - labnet
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - labnet

  frontend:
    build: ../Spreadit_Frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    networks:
      - labnet

networks:
  labnet:


volumes:
  postgres_data:
