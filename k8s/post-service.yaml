apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: spreadit-deploy-post-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: RABBIT_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBIT_URL
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
spec:
  selector:
    app: post-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30003
  type: NodePort
